<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSFIX Product Catalog – PT RISA IMPLANTAMA</title>
<meta name="description" content="Katalog lengkap produk OSFIX orthopedic implants oleh PT RISA IMPLANTAMA — plates, screws, pins, dan lebih.">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="catalog.css">
</head>
<body>

<header class="cat-header">
  <div class="cat-header-inner">
    <div class="cat-header-top">
      <div class="header-brand">
        <img src="assets/images/risa-logo.png" alt="RISA Logo">
        <div>
          <h1>OSFIX Product Catalog</h1>
          <span>PT RISA IMPLANTAMA</span>
        </div>
      </div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Cari produk...">
      </div>
      <a href="index.html" class="back-link">← Kembali ke Website</a>
    </div>
    <div class="filter-tabs" id="filterTabs">
      <button class="tab active" data-cat="all">
        Semua <span class="count-badge" id="countAll">0</span>
      </button>
    </div>
  </div>
</header>

<main class="catalog-body">
  <div class="grid-meta">
    <h2 id="gridTitle">Semua Produk</h2>
    <span class="result-count" id="resultCount"></span>
  </div>
  <div class="product-grid" id="productGrid"></div>
  <div class="empty" id="emptyState">
    <h3>Produk tidak ditemukan</h3>
    <p>Coba kata kunci atau kategori lain.</p>
  </div>
</main>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <div class="lb-inner">
    <div class="lb-img"><img id="lbImg" src="" alt=""></div>
    <div class="lb-info">
      <div class="lb-cat" id="lbCat"></div>
      <div class="lb-title" id="lbTitle"></div>
      <div class="lb-desc" id="lbDesc"></div>
    </div>
  </div>
</div>

<footer class="cat-footer">
  © 2026 PT RISA IMPLANTAMA &nbsp;•&nbsp; Jl. Medokan Sawah Timur No. 41 Surabaya &nbsp;•&nbsp;
  <a href="mailto:risa.implantama@gmail.com">risa.implantama@gmail.com</a>
</footer>

  { category:"Plates", title:"Proximal Lateral Tibia Golf", description:"Plat tibia lateral proksimal dengan desain golf untuk fiksasi fraktur plateau tibial.", img:"assets/images/ctlg/catalog2/Prox Lateral Tibia Golf.png" },
  { category:"Plates", title:"Clavicula S Plate", description:"Plat berbentuk S anatomis untuk fiksasi fraktur klavikula. Tersedia versi kanan dan kiri.", img:"assets/images/ctlg/catalog2/Clavicula S Plate.png" },
  { category:"Plates", title:"Clavicle Hook Plate", description:"Plat dengan kait untuk fiksasi dislokasi akromioklavikular (AC joint separation).", img:"assets/images/ctlg/catalog2/Clav Hook Plate.png" },
  { category:"Plates", title:"Clavicle Z Plate", description:"Plat Z untuk fiksasi fraktur klavikula dengan profil rendah dan desain anatomis.", img:"assets/images/ctlg/catalog2/Clav Z Plate.png" },

  { category:"Plates", title:"Small A Plate", description:"Plat kecil tipe A untuk fiksasi fraktur tulang-tulang kecil tangan dan kaki.", img:"assets/images/ctlg/catalog2/Small A.png" },
  { category:"Plates", title:"Small B Plate", description:"Plat kecil tipe B dengan konfigurasi berbeda untuk fiksasi fraktur tulang-tulang kecil.", img:"assets/images/ctlg/catalog2/Small B.png" },
  { category:"Plates", title:"Trochanter Ear Plate", description:"Plat penahan trokanter dengan desain telinga untuk fiksasi fraktur trokanter femur.", img:"assets/images/ctlg/catalog2/Trochanter Ear.png" },

  { category:"Reconstruction Plates", title:"3.5 Reconstruction Curved", description:"Plat rekonstruksi 3.5mm yang dapat dibentuk ke berbagai sudut, ideal untuk fiksasi fraktur kompleks.", img:"assets/images/ctlg/catalog2/3_5 Recons Curved.png" },

  { category:"Reconstruction Plates", title:"4.5 Reconstruction Straight", description:"Plat rekonstruksi 4.5mm lurus yang kuat untuk fiksasi fraktur pada tulang besar.", img:"assets/images/ctlg/catalog2/4_5 Recons Straight.png" },

  { category:"Cortical Screws", title:"4.5mm Cortical Screw ST", description:"Sekrup kortikal 4.5mm self-tapping. Ideal untuk fiksasi fraktur pada tulang kortikal tebal.", img:"assets/images/ctlg/catalog2/4_5 Cortical ST.png" },

  { category:"Cancellous Screws", title:"4.0mm Cancellous Screw Full Thread", description:"Sekrup kanselus 4.0mm berulir penuh. Digunakan untuk fiksasi tulang kanselus dengan kompresi optimal.", img:"assets/images/ctlg/catalog2/4_0 Cancellous Full.png" },
  { category:"Cancellous Screws", title:"6.5mm Cancellous Screw Full Thread", description:"Sekrup kanselus besar 6.5mm berulir penuh untuk fiksasi fraktur femoral neck dan tulang besar.", img:"assets/images/ctlg/catalog2/6_5 Cancellous Full.png" },
  { category:"Cancellous Screws", title:"6.5mm Cancellous Screw 16mm Thread", description:"Sekrup kanselus 6.5mm dengan ulir 16mm (1/4 thread). Menghasilkan efek lag screw yang kuat.", img:"assets/images/ctlg/catalog2/6_5 Cancellous 16 Th.png" },
  { category:"Cancellous Screws", title:"6.5mm Cancellous Screw 32mm Thread", description:"Sekrup kanselus 6.5mm dengan ulir 32mm (1/2 thread). Digunakan untuk kompresi fraktur tulang besar.", img:"assets/images/ctlg/catalog2/6_5 Cancellous 32 Th.png" },

  // ── PINS ──
  { category:"Pins", title:"K-Wire Trocar", description:"Kirschner wire dengan ujung trocar untuk traksi, fiksasi sementara, dan guide wire pada operasi ortopedi.", img:"assets/images/ctlg/catalog2/K Wire Tocar.png" },
  { category:"Pins", title:"Schanz Screw", description:"Sekrup Schanz untuk fiksasi eksternal. Berulir kortikal dengan alur self-tapping. Tersedia diameter 3–6mm.", img:"assets/images/ctlg/catalog2/Schanz Screw.png" },
];

const CATS = ["all", ...new Set(PRODUCTS.map(p => p.category))];
let currentCat = "all";
let searchQ = "";

const grid    = document.getElementById("productGrid");
const tabs    = document.getElementById("filterTabs");
const empty   = document.getElementById("emptyState");
const titleEl = document.getElementById("gridTitle");
const countEl = document.getElementById("resultCount");
const countAll= document.getElementById("countAll");
const lb      = document.getElementById("lightbox");

countAll.textContent = PRODUCTS.length;

// Build category tabs
CATS.filter(c => c !== "all").forEach(cat => {
  const btn = document.createElement("button");
  btn.className = "tab";
  btn.dataset.cat = cat;
  const n = PRODUCTS.filter(p => p.category === cat).length;
  btn.innerHTML = `${cat} <span class="count-badge">${n}</span>`;
  tabs.appendChild(btn);
});

function render() {
  const q = searchQ.toLowerCase();
  const filtered = PRODUCTS.filter(p => {
    const matchCat = currentCat === "all" || p.category === currentCat;
    const matchQ   = !q || p.title.toLowerCase().includes(q)
                        || p.category.toLowerCase().includes(q)
                        || p.description.toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  grid.innerHTML = "";
  empty.classList.toggle("show", filtered.length === 0);
  countEl.textContent = `${filtered.length} produk`;
  titleEl.textContent = currentCat === "all" ? "Semua Produk" : currentCat;

  filtered.forEach((p, i) => {
    const card = document.createElement("div");
    card.className = "product-card";
    card.style.animationDelay = `${i * 35}ms`;
    card.innerHTML = `
      <div class="card-img-wrap">
        <img src="${p.img}" alt="${p.title}" loading="lazy">
        <span class="cat-tag">${p.category}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${p.title}</div>
        <div class="card-desc">${p.description}</div>
        <div class="card-footer">
          <span class="product-meta">OSFIX Orthopedics</span>
          <button class="view-btn">Detail →</button>
        </div>
      </div>`;
    card.addEventListener("click", () => openLightbox(p));
    grid.appendChild(card);
  });
}

function openLightbox(p) {
  document.getElementById("lbImg").src   = p.img;
  document.getElementById("lbImg").alt   = p.title;
  document.getElementById("lbCat").textContent   = p.category;
  document.getElementById("lbTitle").textContent = p.title;
  document.getElementById("lbDesc").textContent  = p.description;
  lb.classList.add("open");
  document.body.style.overflow = "hidden";
}

document.getElementById("lbClose").addEventListener("click", () => {
  lb.classList.remove("open");
  document.body.style.overflow = "";
});
lb.addEventListener("click", e => {
  if (e.target === lb) { lb.classList.remove("open"); document.body.style.overflow = ""; }
});

tabs.addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  currentCat = btn.dataset.cat;
  render();
});

document.getElementById("searchInput").addEventListener("input", e => {
  searchQ = e.target.value;
  render();
});

render();
</script>
</body>
</html>
