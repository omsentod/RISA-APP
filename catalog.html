<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSFIX Product Catalog 2022 – PT RISA IMPLANTAMA</title>
<meta name="description" content="Complete catalog of OSFIX orthopedic implants by PT RISA IMPLANTAMA — plates, screws, nails, pins, prostheses and more.">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:     #202356;
    --navy-dk:  #14163A;
    --red:      #DB032D;
    --red-dk:   #A60021;
    --white:    #ffffff;
    --gray-lt:  #F4F5FA;
    --gray:     #E8E9F2;
    --text:     #1a1d40;
    --text-muted: rgba(32,35,86,.6);
    --radius:   14px;
    --shadow:   0 4px 24px rgba(32,35,86,.10);
    --shadow-lg:0 12px 40px rgba(32,35,86,.18);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Libre Franklin', sans-serif;
    background: var(--gray-lt);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .cat-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-dk));
    padding: 2rem 0 0;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,.25);
  }
  .cat-header-inner {
    max-width: 1400px; margin: 0 auto; padding: 0 2rem;
  }
  .cat-header-top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.5rem;
  }
  .header-brand { display: flex; align-items: center; gap: 1rem; }
  .header-brand img { height: 38px; object-fit: contain; }
  .header-brand h1 {
    font-size: 1.1rem; font-weight: 800; color: var(--white);
    letter-spacing: -.01em; line-height: 1.2;
  }
  .header-brand span {
    font-size: .72rem; font-weight: 600;
    color: rgba(255,255,255,.55); letter-spacing: .08em;
  }
  .back-link {
    display: inline-flex; align-items: center; gap: .5rem;
    color: rgba(255,255,255,.75); font-size: .875rem; font-weight: 600;
    text-decoration: none; transition: color .2s;
  }
  .back-link:hover { color: var(--white); }

  /* search */
  .search-wrap {
    position: relative; max-width: 420px; flex: 1;
  }
  .search-wrap input {
    width: 100%; padding: .65rem 1rem .65rem 2.6rem;
    border-radius: 99px;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.1);
    backdrop-filter: blur(10px);
    color: var(--white); font-size: .9rem;
    transition: background .2s, border .2s;
  }
  .search-wrap input::placeholder { color: rgba(255,255,255,.45); }
  .search-wrap input:focus {
    outline: none;
    background: rgba(255,255,255,.18);
    border-color: rgba(255,255,255,.4);
  }
  .search-icon {
    position: absolute; left: .9rem; top: 50%; transform: translateY(-50%);
    color: rgba(255,255,255,.5); font-size: 1rem; pointer-events: none;
  }

  /* filter tabs */
  .filter-tabs {
    display: flex; gap: .4rem; overflow-x: auto;
    padding-bottom: .75rem; scrollbar-width: none;
  }
  .filter-tabs::-webkit-scrollbar { display: none; }
  .tab {
    white-space: nowrap;
    padding: .45rem 1.1rem;
    border-radius: 99px;
    border: 1.5px solid rgba(255,255,255,.2);
    background: transparent;
    color: rgba(255,255,255,.65);
    font-size: .8rem; font-weight: 700;
    cursor: pointer; transition: all .25s;
    font-family: inherit; letter-spacing: .03em;
  }
  .tab:hover { background: rgba(255,255,255,.12); color: var(--white); }
  .tab.active {
    background: var(--red); border-color: var(--red);
    color: var(--white);
    box-shadow: 0 4px 16px rgba(219,3,45,.35);
  }
  .count-badge {
    display: inline-block;
    background: rgba(255,255,255,.18);
    border-radius: 99px;
    padding: .05rem .45rem;
    font-size: .7rem; margin-left: .3rem;
  }
  .tab.active .count-badge { background: rgba(255,255,255,.25); }

  /* ── MAIN GRID ── */
  .catalog-body {
    max-width: 1400px; margin: 2.5rem auto; padding: 0 2rem 4rem;
  }
  .grid-meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.5rem; flex-wrap: wrap; gap: .75rem;
  }
  .grid-meta h2 {
    font-size: 1.5rem; font-weight: 800; color: var(--navy);
  }
  .result-count {
    font-size: .875rem; color: var(--text-muted); font-weight: 600;
  }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.5rem;
  }

  /* ── CARD ── */
  .product-card {
    background: var(--white);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform .35s ease, box-shadow .35s ease;
    cursor: pointer;
    display: flex; flex-direction: column;
    animation: fadeUp .45s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .product-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-lg);
  }
  .card-img-wrap {
    position: relative; height: 220px; overflow: hidden;
    background: var(--gray);
  }
  .card-img-wrap img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .5s ease;
  }
  .product-card:hover .card-img-wrap img { transform: scale(1.06); }
  .cat-tag {
    position: absolute; top: .85rem; left: .85rem;
    padding: .28rem .75rem;
    background: rgba(32,35,86,.82);
    backdrop-filter: blur(8px);
    border-radius: 99px;
    color: var(--white); font-size: .65rem; font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
  }
  .page-badge {
    position: absolute; top: .85rem; right: .85rem;
    padding: .28rem .65rem;
    background: rgba(219,3,45,.85);
    border-radius: 99px;
    color: var(--white); font-size: .65rem; font-weight: 700;
  }
  .card-body { padding: 1.25rem 1.25rem 1.5rem; flex: 1; display: flex; flex-direction: column; gap: .5rem; }
  .card-title {
    font-size: 1rem; font-weight: 800; color: var(--navy); line-height: 1.3;
  }
  .card-desc {
    font-size: .825rem; color: var(--text-muted); line-height: 1.6;
    flex: 1;
  }
  .card-footer {
    margin-top: 1rem;
    display: flex; align-items: center; justify-content: space-between;
    padding-top: .75rem; border-top: 1px solid var(--gray);
  }
  .view-btn {
    display: inline-flex; align-items: center; gap: .4rem;
    padding: .45rem 1rem;
    background: linear-gradient(135deg, var(--red), var(--red-dk));
    color: var(--white); border-radius: 99px;
    font-size: .78rem; font-weight: 700;
    text-decoration: none; transition: opacity .25s, transform .25s;
    border: none; cursor: pointer; font-family: inherit;
  }
  .view-btn:hover { opacity: .88; transform: scale(1.04); }
  .product-meta { font-size: .7rem; color: var(--text-muted); font-weight: 600; }

  /* ── EMPTY STATE ── */
  .empty {
    text-align: center; padding: 6rem 2rem; color: var(--text-muted);
    display: none;
  }
  .empty.show { display: block; }
  .empty h3 { font-size: 1.5rem; font-weight: 700; margin-bottom: .5rem; }

  /* ── LIGHTBOX ── */
  .lightbox {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(10,12,40,.92);
    backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .lightbox.open { opacity: 1; pointer-events: auto; }
  .lb-inner {
    background: var(--white); border-radius: 20px;
    max-width: 860px; width: 95%; max-height: 90vh; overflow-y: auto;
    display: grid; grid-template-columns: 1fr 1fr;
    box-shadow: 0 24px 80px rgba(0,0,0,.5);
  }
  .lb-img { background: var(--gray); min-height: 340px; border-radius: 20px 0 0 20px; overflow: hidden; }
  .lb-img img { width: 100%; height: 100%; object-fit: cover; }
  .lb-info { padding: 2.5rem; display: flex; flex-direction: column; gap: .75rem; }
  .lb-cat {
    font-size: .72rem; font-weight: 700; letter-spacing: .08em;
    color: var(--red); text-transform: uppercase;
  }
  .lb-title { font-size: 1.5rem; font-weight: 900; color: var(--navy); line-height: 1.2; }
  .lb-desc { font-size: .9rem; color: var(--text-muted); line-height: 1.7; flex: 1; }
  .lb-close {
    position: absolute; top: 1.25rem; right: 1.5rem;
    background: rgba(255,255,255,.15); border: none; border-radius: 50%;
    width: 40px; height: 40px; font-size: 1.25rem; color: var(--white);
    cursor: pointer; transition: background .2s; font-family: inherit;
  }
  .lb-close:hover { background: rgba(255,255,255,.3); }

  /* ── FOOTER ── */
  .cat-footer {
    background: var(--navy-dk); color: rgba(255,255,255,.6);
    text-align: center; padding: 1.5rem; font-size: .8rem;
  }
  .cat-footer a { color: var(--red); text-decoration: none; }

  @media (max-width: 768px) {
    .cat-header-top { gap: 1rem; }
    .product-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .lb-inner { grid-template-columns: 1fr; }
    .lb-img { min-height: 220px; border-radius: 20px 20px 0 0; }
    .catalog-body { padding: 0 1rem 4rem; }
  }
  @media (max-width: 480px) {
    .product-grid { grid-template-columns: 1fr 1fr; gap: .75rem; }
    .card-img-wrap { height: 160px; }
    .card-body { padding: .9rem; }
    .card-title { font-size: .85rem; }
  }
</style>
</head>
<body>

<header class="cat-header">
  <div class="cat-header-inner">
    <div class="cat-header-top">
      <div class="header-brand">
        <img src="assets/images/risa-logo.png" alt="RISA Logo">
        <div>
          <h1>OSFIX Catalog 2022</h1>
          <span>PT RISA IMPLANTAMA</span>
        </div>
      </div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Cari produk...">
      </div>
      <a href="index.html" class="back-link">← Kembali ke Website</a>
    </div>
    <div class="filter-tabs" id="filterTabs">
      <button class="tab active" data-cat="all">
        Semua <span class="count-badge" id="countAll">0</span>
      </button>
    </div>
  </div>
</header>

<main class="catalog-body">
  <div class="grid-meta">
    <h2 id="gridTitle">Semua Produk</h2>
    <span class="result-count" id="resultCount"></span>
  </div>
  <div class="product-grid" id="productGrid"></div>
  <div class="empty" id="emptyState">
    <h3>Produk tidak ditemukan</h3>
    <p>Coba kata kunci atau kategori lain.</p>
  </div>
</main>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <div class="lb-inner">
    <div class="lb-img"><img id="lbImg" src="" alt=""></div>
    <div class="lb-info">
      <div class="lb-cat" id="lbCat"></div>
      <div class="lb-title" id="lbTitle"></div>
      <div class="lb-desc" id="lbDesc"></div>
    </div>
  </div>
</div>

<footer class="cat-footer">
  © 2026 PT RISA IMPLANTAMA &nbsp;•&nbsp; Jl. Medokan Sawah Timur No. 41 Surabaya &nbsp;•&nbsp;
  <a href="mailto:risa.implantama@gmail.com">risa.implantama@gmail.com</a>
</footer>

<script>
const PRODUCTS = [
  { category:"Plates", title:"Orthopaedic Implants — Overview", description:"Orthopaedic implants are categorized into two groups including permanent joint replacements and temporary fracture fixation devices.", thumbnail:"assets/images/catalog/page_004.png", page:4 },
  { category:"Plates", title:"External Fixation Overview", description:"A method of bony fixation outside the skin using a metal frame that immobilizes the fracture with pins through your skin and into the bone.", thumbnail:"assets/images/catalog/page_005.png", page:5 },
  { category:"Plates", title:"Small T Plate Head 3 – LP (OF.1047.10)", description:"Used for fracture fixation of distal radius bone. Low profile design facilitates fixation without impinging on soft tissue.", thumbnail:"assets/images/catalog/page_022.png", page:22 },
  { category:"Plates", title:"Small T Plate Head 3 – Locking (OF.1047.10 LC)", description:"Fracture fixation and fixation after osteotomies. Low profile locking plate for distal radius.", thumbnail:"assets/images/catalog/page_023.png", page:23 },
  { category:"Plates", title:"Small T Plate Head 4 – LP (OF.10464.10)", description:"Used for fracture fixation of distal radius bone. Head with 4 holes for enhanced stability.", thumbnail:"assets/images/catalog/page_024.png", page:24 },
  { category:"Plates", title:"Small T Plate Head 4 – Locking (OF.10464.10 LC)", description:"Used for fracture fixation of distal radius bone. Locking version for confirmed secure fixation.", thumbnail:"assets/images/catalog/page_025.png", page:25 },
  { category:"Plates", title:"Clavicula S Plate R/L (OF.10521.10 L)", description:"Used for clavicle and calcaneus fractures. Available in Right and Left variants.", thumbnail:"assets/images/catalog/page_026.png", page:26 },
  { category:"Plates", title:"T Plate – LP", description:"Shaft with round profile for humeral and tibial head. Low profile plate facilitates fixation without impinging on soft tissue.", thumbnail:"assets/images/catalog/page_056.png", page:56 },
  { category:"Hip Screws", title:"Small ABP Plate 80°/90°/100° – LC", description:"Used for fracture of distal and proximal femur. Locking compression plate for angular stability.", thumbnail:"assets/images/catalog/page_090.png", page:90 },
  { category:"Conventional Screws", title:"4.5mm Cortical Screw", description:"Standard bone screw for large bone fixation. Fully threaded with hexagonal socket. Self-tapping with cutting grooves.", thumbnail:"assets/images/catalog/page_056.png", page:56 },
  { category:"Cannulated Screws", title:"Cannulated Screw System", description:"Allows guide wire insertion for precise placement. Ideal for fractures of the femoral neck and small bone fragments.", thumbnail:"assets/images/catalog/page_070.png", page:70 },
  { category:"Locking Screws", title:"DHS / DCS Lag Screw", description:"Used with DHS / DCS Plate for hip fracture fixation providing compression across the fracture site.", thumbnail:"assets/images/catalog/page_099.png", page:99 },
  { category:"Locking Screws", title:"3.5mm Cortical Screw – Locking", description:"Type of bone screw for small bone and fragments. Fully threaded spherical head with small hexagonal socket. Self-tapping.", thumbnail:"assets/images/catalog/page_100.png", page:100 },
  { category:"Pins", title:"Schanz Screws", description:"Used for external fixation. With cortical bone thread and self-tapping cutting grooves. Available in 3–6mm diameter.", thumbnail:"assets/images/catalog/page_105.png", page:105 },
  { category:"Arthroplasty (Prosthesis)", title:"Shoulder Stemmed Hemiarthroplasty – Cemented", description:"Replaces arthritic joint surfaces with a highly polished metal ball attached to a stem, implanted with bone cement.", thumbnail:"assets/images/catalog/page_107.png", page:107 },
  { category:"Arthroplasty (Prosthesis)", title:"Elbow Unconstrained Prosthesis", description:"2-part prosthesis. Metal to high density with snap fit link. Requires normal intact ligaments and appropriate static alignment.", thumbnail:"assets/images/catalog/page_108.png", page:108 },
  { category:"Arthroplasty (Prosthesis)", title:"Elbow Semi-Constrained Prosthesis", description:"3-part prosthesis. Metal to high density articulation connected with locking pin. Fixation with bone cement.", thumbnail:"assets/images/catalog/page_109.png", page:109 },
  { category:"External Fixation", title:"Rod System External Fixator", description:"Indications: open fractures, peri-articular fractures, multi-trauma damage control, deformity correction, osteomyelitis.", thumbnail:"assets/images/catalog/page_110.png", page:110 },
  { category:"External Fixation", title:"Tubular System External Fixator", description:"Used for forearm, metacarpal, and tibia depending on the length of Schanz screw and rod used.", thumbnail:"assets/images/catalog/page_111.png", page:111 },
  { category:"External Fixation", title:"Mini Rail External Fixator", description:"Stable solution for fractures and lengthening of small bones. Indicated for foot and hand lengthening in adults.", thumbnail:"assets/images/catalog/page_111.png", page:111 },
  { category:"External Fixation", title:"Ilizarov Apparatus", description:"Used in orthopaedic surgery to lengthen or reshape limb bones, as a limb-sparing technique for complex open bone fractures.", thumbnail:"assets/images/catalog/page_114.png", page:114 },
  { category:"Miscellaneous Implants", title:"Staples", description:"Regular staples useful for fixing soft tissue to bone, including ACL reconstruction, fragment fixation, tendon and ligament repair.", thumbnail:"assets/images/catalog/page_115.png", page:115 },
  { category:"Miscellaneous Implants", title:"Endobutton", description:"Used for delivering strength and stiffness in ligament reconstruction procedures.", thumbnail:"assets/images/catalog/page_116.png", page:116 },
  { category:"Miscellaneous Implants", title:"Washer", description:"Used to distribute stress under a screw head to prevent thin cortical bone from splitting. Serrated washers for avulsion fixation.", thumbnail:"assets/images/catalog/page_116.png", page:116 }
];

const CATS = ["all", ...new Set(PRODUCTS.map(p=>p.category))];
let currentCat = "all";
let searchQ = "";

const grid  = document.getElementById("productGrid");
const tabs  = document.getElementById("filterTabs");
const empty = document.getElementById("emptyState");
const titleEl  = document.getElementById("gridTitle");
const countEl  = document.getElementById("resultCount");
const countAll = document.getElementById("countAll");
const lb    = document.getElementById("lightbox");

countAll.textContent = PRODUCTS.length;

CATS.filter(c=>c!=="all").forEach(cat => {
  const btn = document.createElement("button");
  btn.className = "tab";
  btn.dataset.cat = cat;
  const n = PRODUCTS.filter(p=>p.category===cat).length;
  btn.innerHTML = `${cat} <span class="count-badge">${n}</span>`;
  tabs.appendChild(btn);
});

function render() {
  const filtered = PRODUCTS.filter(p => {
    const matchCat = currentCat === "all" || p.category === currentCat;
    const q = searchQ.toLowerCase();
    const matchQ = !q || p.title.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) || p.description.toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  grid.innerHTML = "";
  empty.classList.toggle("show", filtered.length === 0);
  countEl.textContent = `${filtered.length} produk`;
  titleEl.textContent = currentCat === "all" ? "Semua Produk" : currentCat;

  filtered.forEach((p, i) => {
    const card = document.createElement("div");
    card.className = "product-card";
    card.style.animationDelay = `${i * 40}ms`;
    card.innerHTML = `
      <div class="card-img-wrap">
        <img src="${p.thumbnail}" alt="${p.title}" loading="lazy">
        <span class="cat-tag">${p.category}</span>
        <span class="page-badge">Hal. ${p.page}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${p.title}</div>
        <div class="card-desc">${p.description || "Klik untuk detail produk."}</div>
        <div class="card-footer">
          <span class="product-meta">OSFIX • 2022</span>
          <button class="view-btn">Detail →</button>
        </div>
      </div>`;
    card.addEventListener("click", () => openLightbox(p));
    grid.appendChild(card);
  });
}

function openLightbox(p) {
  document.getElementById("lbImg").src = p.thumbnail;
  document.getElementById("lbImg").alt = p.title;
  document.getElementById("lbCat").textContent = p.category;
  document.getElementById("lbTitle").textContent = p.title;
  document.getElementById("lbDesc").textContent = p.description || "Produk orthopedik berkualitas tinggi dari PT RISA IMPLANTAMA.";
  lb.classList.add("open");
  document.body.style.overflow = "hidden";
}

document.getElementById("lbClose").addEventListener("click", () => {
  lb.classList.remove("open");
  document.body.style.overflow = "";
});
lb.addEventListener("click", e => {
  if (e.target === lb) {
    lb.classList.remove("open");
    document.body.style.overflow = "";
  }
});

tabs.addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  currentCat = btn.dataset.cat;
  render();
});

document.getElementById("searchInput").addEventListener("input", e => {
  searchQ = e.target.value;
  render();
});

render();
</script>
</body>
</html>
